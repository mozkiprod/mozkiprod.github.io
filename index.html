<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mozki — Freelance Video Editor" />
  <title>Mozki</title>
  <link rel="icon" type="image/png" href="logomozkidev.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Erica+One&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header container">
    <nav>
      <ul class="header__menu">
        <li>
          <a class="header__link" href="https://twitter.com/mozkiprod" target="_blank" rel="noopener">
            <img src="x.png" alt="Twitter / X" width="20" height="20" />
          </a>
        </li>
        <li>
          <a class="header__link" href="https://www.instagram.com/mozkiprod/" target="_blank" rel="noopener">
            <img src="insta.png" alt="Instagram" width="20" height="20" />
          </a>
        </li>
      </ul>
      <button aria-label="Open navigation" class="header__bars">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M3 6.75A.75.75 0 013.75 6h16.5a.75.75 0 010 1.5H3.75A.75.75 0 013 6.75zM3 12a.75.75 0 01.75-.75h16.5a.75.75 0 010 1.5H3.75A.75.75 0 013 12zm0 5.25a.75.75 0 01.75-.75h16.5a.75.75 0 010 1.5H3.75a.75.75 0 01-.75-.75z" clip-rule="evenodd"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- MOBILE NAV -->
  <div class="mobile-nav" aria-hidden="true">
    <nav>
      <ul class="mobile-nav__menu">
        <li><a class="mobile-nav__link" href="https://twitter.com/mozkiprod" target="_blank" rel="noopener">Twitter</a></li>
        <li><a class="mobile-nav__link" href="https://www.instagram.com/mozkiprod/" target="_blank" rel="noopener">Instagram</a></li>
      </ul>
    </nav>
  </div>

  <!-- HERO -->
  <main>
    <section class="hero container">
      <img class="hero__img" src="logoo2.jpg" alt="Mozki profile picture" />
      <h2 class="hero__subtitle">
        <span class="hero__subtitle--white">Hi, I'm </span><span class="hero__subtitle--name">Mozki</span>
      </h2>
      <h1 class="hero__title">FREELANCE <br /> VIDEO EDITOR.</h1>
      <p class="hero__description">
        A <i>passionate</i> french video editor, I am skilled in using industry-standard softwares
        to create and customize <i>original</i> videos.
      </p>
      <p class="hero__cta-label">Project idea / Any question or suggestion ?</p>
      <a href="mailto:mateomons20@gmail.com" class="hero__btn btn">Get in touch</a>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer container section"></footer>

  <script src="script.js"></script>
</body>
</html>
